<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 305" width="1180" height="305" role="img" aria-label="Fish-under-sea · 独立开发者 · AI Agent / 桌面工具 / DSH 插件生态">
  <title>Fish-under-sea · 独立开发者 · AI Agent / 桌面工具 / DSH 插件生态</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1128"/>
      <stop offset="45%"  stop-color="#12224d"/>
      <stop offset="100%" stop-color="#0d3b6e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1e40af" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <!-- 鱼形遮罩：抽象几何鱼身，全部为手写矢量 -->
    <mask id="fishMask">
      <rect x="0" y="0" width="1180" height="305" fill="#000"/>
      <!-- 鱼身 -->
      <path d="M 828 170
               C 866 132, 950 124, 1002 152
               C 1030 168, 1030 192, 1002 208
               C 950 236, 866 228, 828 190 Z" fill="#fff"/>
      <!-- 鱼尾 -->
      <path d="M 826 180 L 774 146 L 790 180 L 774 214 Z" fill="#fff"/>
      <!-- 鱼鳍 -->
      <path d="M 916 133 L 940 106 L 958 135 Z" fill="#fff"/>
      <path d="M 918 227 L 944 250 L 960 223 Z" fill="#fff"/>
      <!-- 眼白（挖空） -->
      <circle cx="974" cy="168" r="7" fill="#000"/>
    </mask>
  </defs>

  <!-- 底色 -->
  <rect width="1180" height="305" rx="16" fill="url(#bg)"/>
  <rect width="1180" height="305" rx="16" fill="url(#deep)"/>
  <!-- 顶部与底部高光描边 -->
  <rect x="1" y="1" width="1178" height="303" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- 网格与光晕 -->
  <rect width="1180" height="305" rx="16" fill="url(#grid)"/>
  <circle cx="1010" cy="165" r="205" fill="url(#halo)"/>

  <!-- 装饰：神经网络节点 -->
  <g stroke="#22d3ee" stroke-opacity="0.34" stroke-width="1.4" stroke-dasharray="5 7" fill="none">
    <path d="M 690 78 L 800 116 L 754 196 L 648 168 Z"/>
    <path d="M 800 116 L 902 92"/>
    <path d="M 754 196 L 856 232"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.62">
    <circle cx="690" cy="78"  r="5"/>
    <circle cx="648" cy="168" r="4"/>
    <circle cx="754" cy="196" r="6"/>
    <circle cx="902" cy="92"  r="4"/>
    <circle cx="856" cy="232" r="4.5"/>
  </g>

  <!-- 鱼形马赛克（由小方块拼成） -->
  <g mask="url(#fishMask)">
    <rect x="760" y="100" width="320" height="160" fill="#22d3ee" fill-opacity="0.55"/>
    <g fill="#7dd3fc">
      <rect x="772" y="108" width="18" height="18" fill-opacity="0.85"/>
      <rect x="812" y="108" width="18" height="18" fill-opacity="0.55"/>
      <rect x="852" y="108" width="18" height="18" fill-opacity="0.30"/>
      <rect x="892" y="108" width="18" height="18" fill-opacity="0.55"/>
      <rect x="932" y="108" width="18" height="18" fill-opacity="0.30"/>
      <rect x="972" y="108" width="18" height="18" fill-opacity="0.85"/>
      <rect x="1012" y="108" width="18" height="18" fill-opacity="0.55"/>
      <rect x="772" y="148" width="18" height="18" fill-opacity="0.30"/>
      <rect x="812" y="148" width="18" height="18" fill-opacity="0.85"/>
      <rect x="852" y="148" width="18" height="18" fill-opacity="0.55"/>
      <rect x="892" y="148" width="18" height="18" fill-opacity="0.30"/>
      <rect x="932" y="148" width="18" height="18" fill-opacity="0.85"/>
      <rect x="972" y="148" width="18" height="18" fill-opacity="0.55"/>
      <rect x="1012" y="148" width="18" height="18" fill-opacity="0.85"/>
      <rect x="772" y="188" width="18" height="18" fill-opacity="0.55"/>
      <rect x="812" y="188" width="18" height="18" fill-opacity="0.30"/>
      <rect x="852" y="188" width="18" height="18" fill-opacity="0.85"/>
      <rect x="892" y="188" width="18" height="18" fill-opacity="0.55"/>
      <rect x="932" y="188" width="18" height="18" fill-opacity="0.30"/>
      <rect x="972" y="188" width="18" height="18" fill-opacity="0.30"/>
      <rect x="1012" y="188" width="18" height="18" fill-opacity="0.55"/>
      <rect x="852" y="228" width="18" height="18" fill-opacity="0.55"/>
      <rect x="932" y="228" width="18" height="18" fill-opacity="0.30"/>
      <rect x="872" y="128" width="18" height="18" fill-opacity="0.85"/>
      <rect x="952" y="128" width="18" height="18" fill-opacity="0.30"/>
      <rect x="872" y="208" width="18" height="18" fill-opacity="0.30"/>
      <rect x="952" y="208" width="18" height="18" fill-opacity="0.85"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.92">
      <circle cx="974" cy="168" r="8"/>
    </g>
    <g fill="#0a1128">
      <circle cx="976" cy="168" r="3.6"/>
    </g>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-opacity="0.40" stroke-width="1.2">
    <path d="M 828 170 C 866 132, 950 124, 1002 152 C 1030 168, 1030 192, 1002 208 C 950 236, 866 228, 828 190 Z"/>
    <path d="M 826 180 L 774 146 L 790 180 L 774 214 Z"/>
    <path d="M 916 133 L 940 106 L 958 135 Z"/>
    <path d="M 918 227 L 944 250 L 960 223 Z"/>
  </g>

  <!-- 左侧文案 -->
  <g font-family="'Segoe UI','Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif">
    <text x="66" y="96" font-size="14" letter-spacing="5.2" fill="#8fd8f0" font-weight="600">INDEPENDENT DEVELOPER · SHENZHEN</text>
    <text x="64" y="170" font-size="60" font-weight="800" fill="url(#teal)" letter-spacing="1">Fish-under-sea</text>
    <text x="66" y="222" font-size="24" font-weight="600" fill="url(#sky)" letter-spacing="2.4">AI Agent · 桌面工具 · DSH 插件生态</text>
    <text x="66" y="262" font-size="15.5" fill="#c3d7ee" letter-spacing="1.2">深圳城市职业学院 25 级「智能·创造者创新实验班」</text>
  </g>

  <!-- 左下角强调条 -->
  <rect x="66" y="284" width="86" height="4" rx="2" fill="url(#teal)"/>
  <rect x="158" y="284" width="26" height="4" rx="2" fill="#60a5fa" fill-opacity="0.75"/>
</svg>